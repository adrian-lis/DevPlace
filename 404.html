<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Page not found - the requested page could not be found on Dev Place."
    />

    <title>404 - Page Not Found | Dev Place</title>

    <script>
      (() => {
        try {
          const saved = JSON.parse(localStorage.getItem("devplace-settings"));

          document.documentElement.dataset.theme =
            saved && saved.theme === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/DevPlace/images/logo.svg" />
    <link rel="stylesheet" href="/DevPlace/style.css" />

    <script src="/DevPlace/scripts/main.js" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="container header-inner">
        <a href="/DevPlace/" class="logo" aria-label="Dev Place - Home">
          <img src="/DevPlace/images/logo.svg" alt="Dev Place" class="logo-icon" />
          <span class="logo-text">Dev Place</span>
        </a>

        <button
          class="menu-button"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="main-menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="main-menu" class="menu" aria-label="Main menu">
          <div class="menu-navigation">
            <a href="/DevPlace/">Home</a>
            <a href="/DevPlace/downloads/">Downloads</a>
            <a href="/DevPlace/projects/">Projects</a>
            <a href="/DevPlace/about/">About</a>
          </div>

          <div class="menu-divider"></div>

          <section class="accessibility">
            <div class="accessibility-heading">Accessibility</div>

            <div class="setting-group">
              <span class="setting-label">Theme</span>

              <div class="theme-switch">
                <button
                  type="button"
                  class="setting-button theme-button"
                  data-theme-setting="dark"
                  aria-pressed="true"
                >
                  Dark
                </button>

                <button
                  type="button"
                  class="setting-button theme-button"
                  data-theme-setting="light"
                  aria-pressed="false"
                >
                  Light
                </button>
              </div>
            </div>

            <div class="setting-group">
              <span class="setting-label">Text size</span>

              <div class="font-controls">
                <button
                  type="button"
                  class="setting-button size-button"
                  data-font-action="decrease"
                  aria-label="Decrease text size"
                >
                  A-
                </button>

                <button
                  type="button"
                  class="setting-button size-button"
                  data-font-action="increase"
                  aria-label="Increase text size"
                >
                  A+
                </button>
              </div>
            </div>

            <button
              type="button"
              class="setting-button full-button"
              data-toggle-setting="contrast"
              aria-pressed="false"
            >
              High contrast
            </button>

            <button
              type="button"
              class="setting-button full-button"
              data-toggle-setting="motion"
              aria-pressed="false"
            >
              Reduce motion
            </button>

            <button type="button" class="reset-button" data-reset-settings="true">
              Reset settings
            </button>
          </section>
        </nav>
      </div>
    </header>

    <main>
      <section class="intro">
        <div class="container">
          <h1>404</h1>
          <p>Page not found.</p>
        </div>
      </section>

      <section class="content">
        <div class="container">
          <div class="content-header">
            <h2>Page unavailable</h2>
          </div>

          <p>The page you are looking for does not exist or may have been moved.</p>

          <p>
            <a href="/DevPlace/">Return to the homepage</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container-footer">
        <p>&copy; 2026 Dev Place.</p>
      </div>
    </footer>
  </body>
</html>
